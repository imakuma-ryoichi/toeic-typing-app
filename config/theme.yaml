# ==============================================================================
# TOEIC Typing App - テーマ・フォント・カラー設定ファイル
# このファイルを編集することで、アプリの文字色や背景色、タイポグラフィを簡単にカスタマイズできます。
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. タイポグラフィ設定 (フォント & 文字サイズ)
# ------------------------------------------------------------------------------
typography:
  fonts:
    # UI用フォント（日本語・見出し・説明文）
    sans: "'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    # タイピング用等幅フォント（英数字）
    mono: "'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Monaco, Consolas, monospace"
  typing:
    # タイピング文字の表示サイズ・字間・幅
    fontSize: "2rem"
    letterSpacing: "0.02em"
    minWidth: "0.6em"
    spaceMinWidth: "0.55em"

# ------------------------------------------------------------------------------
# 2. テーマ配色設定
# ------------------------------------------------------------------------------
themes:
  # ----------------------------------------------------------------------------
  # ライトテーマ (Paper / デフォルト)
  # ----------------------------------------------------------------------------
  light:
    # 基本UIカラー
    ui:
      bgApp: "#FFFFFF"                  # アプリ全体の背景色
      bgCard: "#F8FAFC"                 # タイピング枠・カード背景色
      borderSubtle: "#E2E8F0"           # 境界線・区切り線の色
      textPrimary: "#0F172A"            # 通常本文・未入力文字の色
      textMuted: "#64748B"              # 補足テキスト・説明文の色

    # 上部ヘッダー（リボン）
    ribbon:
      border: "#E2E8F0"                 # ヘッダー境界線
      hover: "rgba(15, 23, 42, 0.06)"   # タブホバー時の背景
      activeBg: "rgba(15, 23, 42, 0.09)"# 選択中タブの背景

    # タイピング判定カラー
    typing:
      caret: "#2563EB"                  # カーソル（キャレット）の色
      targetBg: "rgba(37, 99, 235, 0.08)" # 現在打つべきターゲット文字の背景色
      correct: "#10b981"                # 一発正解した文字の色 (エメラルド緑)
      onceMissed: "#ea580c"             # ミス後に正しく打ち直した文字の色 (オレンジ)
      incorrect: "#dc2626"              # 現在間違えている文字の色 (赤)

    # スペース文字のハイライト設定
    spaces:
      markerColor: "#2563EB"            # スペース記号(␣)の色
      missedBg: "rgba(234, 88, 12, 0.3)"# 打ち直したスペースの背景色
      missedBorder: "#ea580c"           # 打ち直したスペースの下線色
      incorrectBg: "#dc2626"            # ミス中のスペースの背景色
      incorrectColor: "#ffffff"         # ミス中のスペース記号の色

    # 分析・グラフカラー
    charts:
      wpm: "#2563EB"                    # WPM推移線の色
      firstTryAccuracy: "#F97316"       # 一発精度の色
      normalAccuracy: "#10B981"         # 通常精度の色

  # ----------------------------------------------------------------------------
  # スレートテーマ (Slate / ダーク調)
  # ----------------------------------------------------------------------------
  slate:
    # 基本UIカラー
    ui:
      bgApp: "#1E293B"                  # アプリ全体の背景色
      bgCard: "#0F172A"                 # タイピング枠・カード背景色
      borderSubtle: "#334155"           # 境界線・区切り線の色
      textPrimary: "#F8FAFC"            # 通常本文・未入力文字の色
      textMuted: "#94A3B8"              # 補足テキスト・説明文の色

    # 上部ヘッダー（リボン）
    ribbon:
      border: "#334155"                 # ヘッダー境界線
      hover: "rgba(248, 250, 252, 0.09)"   # タブホバー時の背景
      activeBg: "rgba(248, 250, 252, 0.14)" # 選択中タブの背景

    # タイピング判定カラー
    typing:
      caret: "#38BDF8"                  # カーソル（キャレット）の色
      targetBg: "rgba(56, 189, 248, 0.15)" # 現在打つべきターゲット文字の背景色
      correct: "#34d399"                # 一発正解した文字の色 (明るい緑)
      onceMissed: "#fb923c"             # ミス後に正しく打ち直した文字の色 (明るいオレンジ)
      incorrect: "#f87171"              # 現在間違えている文字の色 (明るい赤)

    # スペース文字のハイライト設定
    spaces:
      markerColor: "#38BDF8"            # スペース記号(␣)の色
      missedBg: "rgba(251, 146, 60, 0.35)" # 打ち直したスペースの背景色
      missedBorder: "#fb923c"              # 打ち直したスペースの下線色
      incorrectBg: "#ef4444"               # ミス中のスペースの背景色
      incorrectColor: "#ffffff"            # ミス中のスペース記号の色

    # 分析・グラフカラー
    charts:
      wpm: "#38BDF8"                    # WPM推移線の色
      firstTryAccuracy: "#F97316"       # 一発精度の色
      normalAccuracy: "#10B981"         # 通常精度の色
