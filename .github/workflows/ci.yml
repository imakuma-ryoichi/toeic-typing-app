name: CI (Tauri App)

on:
  push:
    branches: [ "main", "master" ]
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------
  # ジョブ1: Dockerfile の変更検知とビルド
  # ---------------------------------------------------
  prepare-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Image Tag
        id: meta
        run: |
          HASH=$(sha256sum Dockerfile | cut -c1-16)
          echo "tag=ghcr.io/imakuma-ryoichi/tauri-builder:${HASH}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------
  # ジョブ2: フロントエンドの検証 (並列実行)
  # ---------------------------------------------------
  frontend-checks:
    needs: prepare-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4

        # 1. pnpmの公式セットアップアクションを追加
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.14.0 # エラーログに記載されていたバージョンを指定

      - name: Install Frontend Dependencies
        working-directory: ./toeic-typing-app
        run: pnpm install --frozen-lockfile

      # TypeScriptの型チェック等（ESLintがあればここに追加）
      - name: Run TypeScript Check
        working-directory: ./toeic-typing-app
        run: pnpm exec tsc --noEmit

  # ---------------------------------------------------
  # ジョブ3: バックエンド検証とTauriビルド (並列実行)
  # ---------------------------------------------------
  backend-and-build:
    needs: prepare-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image.outputs.image-tag }}
    env:
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Frontend Dependencies
        working-directory: ./toeic-typing-app
        run: pnpm install --frozen-lockfile

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './toeic-typing-app/src-tauri -> target'

      - name: Rust Linter
        working-directory: ./toeic-typing-app
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml

        # 標準の cargo test から爆速の cargo nextest に変更
      - name: Rust Tests
        working-directory: ./toeic-typing-app
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --no-tests=pass

      - name: Build Tauri App
        working-directory: ./toeic-typing-app
        run: pnpm tauri build --no-bundle
