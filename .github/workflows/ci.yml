name: CI (Tauri App)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'Dockerfile'
  pull_request: {}

jobs:
  build-tauri:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/imakuma-ryoichi/tauri-builder:latest

    steps:
      - uses: actions/checkout@v4

      # 1. pnpm のセットアップ
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      # 2. 依存関係のインストール
      - name: Install Frontend Dependencies
        working-directory: ./toeic-typing-app/toeic-typing-app
        run: pnpm install --frozen-lockfile

      # 3. Rust のキャッシュ設定
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './toeic-typing-app/toeic-typing-app/src-tauri -> target'

      # 4. Rust コードの静的解析・テスト
      - name: Rust Linter & Test
        working-directory: ./toeic-typing-app/toeic-typing-app
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      # 5. Tauri のビルド
      - name: Build Tauri App
        working-directory: ./toeic-typing-app/toeic-typing-app
        run: pnpm tauri build
