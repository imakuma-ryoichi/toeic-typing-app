name: CI (Tauri App)

on:
  push:
    branches: [ "main", "master" ]
  pull_request: {}

jobs:
  # ---------------------------------------------------
  # ジョブ1: Dockerfileに変更があればビルド、なければスキップ
  # ---------------------------------------------------
  prepare-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Dockerfile の中身のハッシュ値から一意のタグ名を生成
      - name: Generate Image Tag
        id: meta
        run: |
          HASH=$(sha256sum Dockerfile | cut -c1-16)
          # 小文字のユーザー名を指定（imakuma-ryoichi）
          echo "tag=ghcr.io/imakuma-ryoichi/tauri-builder:${HASH}" >> $GITHUB_OUTPUT

      # キャッシュを活用し、中身が変わっていなければ数秒でスキップ
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------
  # ジョブ2: アプリの静的解析とビルド（ジョブ1のイメージを使用）
  # ---------------------------------------------------
  build-tauri:
    needs: prepare-image
    runs-on: ubuntu-latest
    container:
      # 上のジョブで決定したタグ（最新ビルド または 既存キャッシュ）を使用
      image: ${{ needs.prepare-image.outputs.image-tag }}

    steps:
      - uses: actions/checkout@v4

      # 1. pnpm の有効化
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      # 2. フロントエンド依存関係のインストール
      - name: Install Frontend Dependencies
        working-directory: ./toeic-typing-app
        run: pnpm install --frozen-lockfile

      # 3. Rust のキャッシュ設定
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './toeic-typing-app/src-tauri -> target'

      # 4. Rust コードの静的解析・テスト
      - name: Rust Linter & Test
        working-directory: ./toeic-typing-app
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      # 5. Tauri のビルド
      - name: Build Tauri App
        working-directory: ./toeic-typing-app
        run: pnpm tauri build
