name: CI (Tauri App)

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------
  # ジョブ0: 変更ファイルの検知 (未変更領域のジョブをスキップ)
  # ---------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'toeic-typing-app/src/**'
              - 'toeic-typing-app/public/**'
              - 'toeic-typing-app/index.html'
              - 'toeic-typing-app/package.json'
              - 'toeic-typing-app/pnpm-lock.yaml'
              - 'toeic-typing-app/tsconfig*.json'
              - 'toeic-typing-app/vite.config.ts'
              - '.github/workflows/ci.yml'
            backend:
              - 'toeic-typing-app/src-tauri/**'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------
  # ジョブ1: Dockerfile の変更検知とビルド (バックエンド変更時のみ)
  # ---------------------------------------------------
  prepare-image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Image Tag
        id: meta
        run: |
          HASH=$(sha256sum Dockerfile | cut -c1-16)
          echo "tag=ghcr.io/imakuma-ryoichi/tauri-builder:${HASH}" >> $GITHUB_OUTPUT

      - name: Check if image exists
        id: check-image
        run: |
          if docker manifest inspect ${{ steps.meta.outputs.tag }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image already exists in GHCR. Skipping build."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image not found. Proceeding with build."
          fi

      - name: Build and push Docker image
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------
  # ジョブ2: フロントエンドの検証 (フロント変更時のみ実行)
  # ---------------------------------------------------
  frontend-checks:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: toeic-typing-app/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        working-directory: ./toeic-typing-app
        run: pnpm install --frozen-lockfile

      # TypeScriptの型チェック + Viteビルド検証
      - name: Run TypeScript Check & Vite Build
        working-directory: ./toeic-typing-app
        run: pnpm build

  # ---------------------------------------------------
  # ジョブ3: バックエンド検証とTauriビルド (バックエンド変更時のみ実行)
  # ---------------------------------------------------
  backend-and-build:
    needs: [changes, prepare-image]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare-image.outputs.image-tag }}
    env:
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: "-Dwarnings -C linker=clang -C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.14.0

      - name: Get pnpm store directory
        id: pnpm-cache
        working-directory: ./toeic-typing-app
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('toeic-typing-app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Frontend Dependencies
        working-directory: ./toeic-typing-app
        run: pnpm install --frozen-lockfile

      # フロントエンドのビルド検証は frontend-checks で行うため、
      # Rustキャッシュが dist の再生成で無効化されないよう固定のダミー dist を用意
      - name: Prepare Dummy Frontend Dist for Tauri Context
        working-directory: ./toeic-typing-app
        run: |
          mkdir -p dist
          echo "<!doctype html><html><body></body></html>" > dist/index.html

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './toeic-typing-app/src-tauri -> target'

      - name: Rust Linter
        working-directory: ./toeic-typing-app
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml

      # 標準の cargo test から爆速の cargo nextest に変更
      - name: Rust Tests
        working-directory: ./toeic-typing-app
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --no-tests=pass

      # CI検証用のため --debug で高速ビルド（LTOを回避）
      # beforeBuildCommand を空に上書きし、重複する Vite ビルドとキャッシュ破棄を防止
      - name: Build Tauri App
        working-directory: ./toeic-typing-app
        run: pnpm tauri build --no-bundle --debug --config '{"build":{"beforeBuildCommand":""}}'
